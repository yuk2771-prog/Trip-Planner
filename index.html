  const tbl = (head, rows, foot, cls) => h('div', { class: 'tw' }, h('table', { class: cls || null },
    h('thead', {}, h('tr', {}, head.map(x => h('th', { class: x[1] || '' }, x[0])))), h('tbody', {}, rows), foot ? h('tfoot', {}, foot) : null));
  const r = h('article', { class: 'report', lang });
  r.append(h('header', {}, h('h1', {}, m.title || L('여행', 'Trip')), m.subtitle ? h('p', { class: 'r-sub' }, m.subtitle) : null,
    h('p', { class: 'r-meta' }, [start ? ymd(start) + ' – ' + ymd(end) : L('출발일 미정', 'No start date'), nightsL(t.nights), L(trip.cities.length + '개 도시', trip.cities.length + ' cities'), L(t.countries.length + '개국', t.countries.length + ' countries')].join(' · '))));
  r.append(h('div', { class: 'r-kpis' }, [[L('총 예산', 'Total budget'), fmtBase(t.grand), fmtHome(t.grand * fx)], [L('하루 평균', 'Per day'), t.nights ? fmtBase(t.grand / t.nights) : '-', ''],
    [L('체류비', 'Stays'), fmtBase(t.ground), ''], [L('이동비', 'Transfers'), fmtBase(t.transport), ''], [L('기타 고정비', 'Fixed costs'), fmtBase(t.fixed), '']].map(([l, v, s]) =>
    h('div', { class: 'r-kpi' }, h('div', { class: 'l' }, l), h('div', { class: 'v' }, v), s ? h('div', { class: 's' }, s) : null))));

  if (o.plan && trip.cities.length) {
    const { between, loose } = linkRoutes();
    const rows = [];
    sch.forEach((s, i) => {
      const c = s.c, todos = lines(c.todos);
      rows.push(h('tr', {}, h('td', { class: 'n c-n' }, i + 1), h('td', { class: 'nw c-d' }, s.arr ? mdw(s.arr) + ' – ' + mdw(s.dep) : ''),
        h('td', { class: 'c-c' }, h('b', {}, c.name || L('(이름 없음)', '(untitled)')), h('br'), h('span', { class: 'r-todo' }, [c.country, c.base].filter(Boolean).join(' · ')),
          cityWarnings(c).map(w => h('div', { class: 'r-warn r-todo' }, '⚠ ' + w))),
        h('td', { class: 'n c-k', 'data-u': L('박', ' nights') }, s.n), h('td', { class: 'n c-p' }, fmtBase(num(c.daily))),
        h('td', { class: 'r-todo c-t' }, todos.join(' · '))));
      const rt = between[i];
      if (rt) rows.push(h('tr', { class: 'leg' + (routeWarning(rt) ? ' w' : '') }, h('td', { colspan: 6 }, '↓ ' + modeText(rt.mode) + (routeText(rt) ? ' · ' + routeText(rt) : '') + (routeWarning(rt) ? '  ⚠ ' + routeWarning(rt) : ''))));
    });
    r.append(h('h2', {}, L('일정', 'Itinerary')), tbl([['#', 'n'], [L('날짜', 'Dates')], [L('도시', 'City')], [L('박', 'Nights'), 'n'], [L('하루', 'Per day'), 'n'], [L('할 일 · 갈 곳', 'To do · places')]], rows, null, 'r-plan'));
    if (loose.length) r.append(h('h3', {}, L('기타 이동', 'Other transfers')), tbl([[L('구간', 'Route')], [L('수단', 'How')], [L('메모 · 시간 · 비용', 'Notes · time · cost')]],
      loose.map(x => h('tr', {}, h('td', {}, (x.from || '?') + ' → ' + (x.to || '?')), h('td', { class: 'nw' }, modeText(x.mode)), h('td', {}, routeText(x))))));
  }
  if (o.budget) {
    const byC = {};
    trip.cities.forEach(c => { const k = (c.country || '').trim() || noCountry(); byC[k] = byC[k] || { n: 0, s: 0 }; byC[k].n += num(c.nights); byC[k].s += num(c.nights) * num(c.daily); });
    r.append(h('h2', {}, L('예산', 'Budget')),
      tbl([[L('나라', 'Country')], [L('박', 'Nights'), 'n'], [L('하루 평균', 'Per day'), 'n'], [L('체류비', 'Stays'), 'n'], [m.homeCur, 'n']],
        Object.entries(byC).map(([k, x]) => h('tr', {}, h('td', {}, k), h('td', { class: 'n' }, x.n), h('td', { class: 'n' }, x.n ? fmtBase(x.s / x.n) : '-'), h('td', { class: 'n' }, fmtBase(x.s)), h('td', { class: 'n' }, fmtHome(x.s * fx)))),
        h('tr', {}, h('td', {}, L('체류비 합계', 'Stays total')), h('td', { class: 'n' }, t.nights), h('td', {}), h('td', { class: 'n' }, fmtBase(t.ground)), h('td', { class: 'n' }, fmtHome(t.ground * fx)))),
      tbl([[L('항목', 'Item')], [L('금액', 'Amount'), 'n'], [m.homeCur, 'n']],
        [h('tr', {}, h('td', {}, L('이동비 (' + trip.routes.length + '건)', 'Transfers (' + trip.routes.length + ')')), h('td', { class: 'n' }, fmtBase(t.transport)), h('td', { class: 'n' }, fmtHome(t.transport * fx))),
          ...trip.costs.map(c => h('tr', {}, h('td', {}, c.label), h('td', { class: 'n' }, num(c.amount) ? fmtBase(num(c.amount)) : L('미입력', '—')), h('td', { class: 'n' }, fmtHome(num(c.amount) * fx))))],
        h('tr', {}, h('td', {}, L('총 예산', 'Total budget')), h('td', { class: 'n' }, fmtBase(t.grand)), h('td', { class: 'n' }, fmtHome(t.grand * fx)))),
      h('p', { class: 'r-todo' }, L('환율 1 ', 'Rate 1 ') + m.baseCur + ' = ' + fx.toLocaleString('en-US') + ' ' + m.homeCur + (m.fxUpdated ? ' (' + m.fxUpdated + ')' : '')));
  }
  if (o.prep) {
    if (trip.bookings.length) r.append(h('h2', {}, L('미리 예약할 것', 'Book ahead')), tbl([['', ''], [L('항목', 'Item')], [L('나라', 'Country')], [L('언제', 'When')], [L('메모', 'Notes')]],
      trip.bookings.map(b => h('tr', {}, h('td', {}, b.done ? '☑' : '☐'), h('td', {}, b.item), h('td', {}, b.country), h('td', {}, b.when), h('td', { class: 'r-todo' }, b.memo)))));
    [['prep', L('준비할 일', 'To do')], ['pack', L('짐', 'Packing')]].forEach(([tab, label]) => {
      const gs = trip.checklists.filter(g => g.tab === tab);
      if (gs.length) r.append(h('h2', {}, label), h('div', { class: 'r-groups' }, gs.map(g => h('div', { class: 'r-group' }, h('h3', {}, g.title),
        h('ul', { class: 'r-check' }, g.items.map(it => h('li', { class: it.done ? 'd' : '' }, (it.done ? '☑ ' : '☐ ') + it.text)))))));
    });
  }
  if (o.info && trip.countries.length) r.append(h('h2', {}, L('나라별 정보', 'Country info')), tbl([[L('나라', 'Country')], [L('긴급번호', 'Emergency')], [L('통화', 'Currency')], [L('결제', 'Payment')], [L('치안 · 여행경보', 'Safety · advisories')]],
    trip.countries.map(c => h('tr', {}, h('td', {}, h('b', {}, c.name)), h('td', {}, c.emergency), h('td', {}, c.currency), h('td', {}, c.payment), h('td', { class: c.advisory ? 'r-warn' : '' }, c.advisory)))));
  if (o.notes && (trip.notes || '').trim()) r.append(h('h2', {}, L('메모', 'Notes')), h('div', { class: 'r-notes' }, trip.notes));
  if (o.ledger && trip.ledger.length) r.append(h('h2', {}, L('가계부', 'Spending')), tbl([[L('날짜', 'Date')], [L('도시', 'City')], [L('분류', 'Category')], [L('내용', 'What')], [L('현지 금액', 'Local'), 'n'], [m.baseCur, 'n'], [m.homeCur, 'n']],
    trip.ledger.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(l => h('tr', {}, h('td', { class: 'nw' }, l.date), h('td', {}, l.city === '-' ? '' : l.city), h('td', {}, catName(l.cat)), h('td', {}, l.desc),
      h('td', { class: 'n' }, l.cur && l.cur !== baseCode() ? fmtCur(num(l.orig), l.cur) : ''), h('td', { class: 'n' }, fmtBase(num(l.amount))), h('td', { class: 'n' }, fmtHome(num(l.amount) * (num(l.fx) || fx))))),
    h('tr', {}, h('td', { colspan: 5 }, L('합계', 'Total')), h('td', { class: 'n' }, fmtBase(t.spent)), h('td', { class: 'n' }, fmtHome(t.spentHome)))));
  r.append(h('p', { class: 'r-foot' }, new Date().toLocaleDateString(LOC()) + L(' 기준 · Trip Planner', ' · Trip Planner')));
  return r;
}

/* ============ 가져오기 ============ */
function normalizeTrip(t) {
  if (!t || !t.meta || !Array.isArray(t.cities)) return null;
  const base = blankTrip();
  const out = Object.assign(base, t, { meta: Object.assign(base.meta, t.meta) });
  if (!out.id) out.id = uid();
  return out;
}
function addImported(t, log) {
  const ex = store.trips[t.id];
  if (ex) {
    const keep = confirm(L('"' + (ex.meta.title || '') + '" 여행이 이미 이 기기에 있습니다.\n\n확인: 가져온 파일로 덮어쓰기\n취소: 사본으로 따로 추가',
      '"' + (ex.meta.title || '') + '" is already on this device.\n\nOK: replace it with the file\nCancel: add as a copy'));
    if (!keep) { t.id = uid(); t.meta.title = (t.meta.title || L('여행', 'Trip')) + L(' (가져옴)', ' (imported)'); log.push(L('사본 추가: ', 'Added copy: ') + t.meta.title); }
    else log.push(L('덮어씀: ', 'Replaced: ') + t.meta.title);
  } else log.push(L('추가: ', 'Added: ') + t.meta.title);
  store.trips[t.id] = t;
  return t.id;
}
async function importFiles(input) {
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;
  const log = [], bad = [];
  let lastId = null, nPhotos = 0, skipped = 0;
  for (const f of files) {
    try {
      const d = JSON.parse(await f.text());
      let list = [];
      if (d && d.type === 'backup' && Array.isArray(d.trips)) list = d.trips;
      else if (d && d.type === 'trip' && d.trip) list = [d.trip];
      else list = [d];                       // 예전 형식 (여행 객체만 있는 파일)
      const map = {};
      const valid = list.map(x => { const old = x && x.id; const n = normalizeTrip(x); if (n) n._old = old; return n; }).filter(Boolean);
      if (!valid.length) throw new Error();
      valid.forEach(t => { const old = t._old; delete t._old; lastId = addImported(t, log); if (old) map[old] = t.id; });
      for (const p of (Array.isArray(d.photos) ? d.photos : [])) {
        if (!photoDB) { skipped++; continue; }
        const tid = map[p.trip];
        if (!tid || !p.data) continue;
        try { const { data, ...rest } = p; await putPhoto(Object.assign(rest, { trip: tid, blob: await dataURLToBlob(data) })); nPhotos++; } catch (e) { skipped++; }
      }
    } catch (e) { bad.push(f.name); }
  }
  if (lastId) switchTrip(lastId);
  alert((log.length ? log.join('\n') : L('가져온 여행 없음', 'No trips imported'))
    + (nPhotos ? L('\n사진 ' + nPhotos + '장', '\n' + nPhotos + ' photos') : '')
    + (skipped ? L('\n저장하지 못한 사진 ' + skipped + '장', '\nCouldn\'t save ' + skipped + ' photos') : '')
    + (bad.length ? L('\n\n읽지 못한 파일: ', '\n\nCouldn\'t read: ') + bad.join(', ') : ''));
}
document.getElementById('import-file').addEventListener('change', e => importFiles(e.target));

/* ============ 시작 ============ */
setLang(lang);
applyMode();
const firstRun = !lsGet(STORE_KEY);
store = loadStore();
// 새로 생긴 설정값(예: 현지 통화 환율, 테마)을 예전 데이터에도 채워 넣기
Object.values(store.trips).forEach(t => { t.meta = Object.assign(blankTrip().meta, t.meta); if (!t.meta.rates) t.meta.rates = {}; });
trip = store.trips[store.current] || Object.values(store.trips)[0];
store.current = trip.id;
if (firstRun) save();
if (!lsGet(FIRST_KEY)) lsSet(FIRST_KEY, new Date().toISOString());
render();
loadPhotos().then(() => { if (PHOTOS.size) render(); });

// 오프라인 지원: GitHub Pages(https)나 localhost에서만
if (canOffline()) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});   // 브라우저가 데이터를 함부로 지우지 않게 요청
}
window.addEventListener('online', renderTop);
window.addEventListener('offline', renderTop);
</script>
