<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trip Planner</title>
<script>
/* 첫 화면이 깜빡이지 않도록 저장된 테마를 그리기 전에 적용 */
try { document.documentElement.dataset.theme = localStorage.getItem('tripPlanner_theme') || 'lavender'; } catch (e) { document.documentElement.dataset.theme = 'lavender'; }
</script>
<style>
/* ===== 테마 변수 =====
   선택자를 html에 한정하지 않아서 설정 화면의 테마 견본(data-theme)도 같은 변수를 씀.
   --accent: 장식(점, 막대) / --accent-strong: 글자·주요 버튼 배경 (대비 확보) */
:root,[data-theme="lavender"],[data-theme="auto"]{
  --bg:#f7f5fa;--surface:#fff;--line:#e8e3ef;--text:#2f2a3b;--muted:#6b6580;
  --accent:#8e7cc3;--accent-strong:#5f4f99;--accent-soft:#eeeaf8;--on-accent:#fff;
  --rose:#e7c8d3;--rose-tint:#f8edf1;--rose-text:#944d69;
  --mauve:#d8cbe9;--mauve-tint:#f3eef9;--mauve-text:#654e8a;
  --peri:#c9d4ef;--peri-tint:#eef2fb;--peri-text:#46578f;
  --input-bg:#fff;--gray-bg:#f1eff5;--gray-text:#57526a;--empty:#a9a3b6;
  --shadow:0 1px 2px rgba(45,35,70,.05),0 6px 20px rgba(45,35,70,.06);
}
[data-theme="sage"]{
  --bg:#f4f7f3;--surface:#fff;--line:#e1e8de;--text:#2c3630;--muted:#606c62;
  --accent:#6f957a;--accent-strong:#466a52;--accent-soft:#e7f0e9;--on-accent:#fff;
  --rose:#ecc9c3;--rose-tint:#faeeec;--rose-text:#8d4f45;
  --mauve:#d5e3c9;--mauve-tint:#f1f6ec;--mauve-text:#50663d;
  --peri:#c6dfdc;--peri-tint:#ecf5f4;--peri-text:#38635e;
  --input-bg:#fff;--gray-bg:#eef2ed;--gray-text:#515c54;--empty:#a7b2a9;
}
[data-theme="peach"]{
  --bg:#fbf6f2;--surface:#fff;--line:#f0e2d8;--text:#3d312b;--muted:#76665b;
  --accent:#c47e60;--accent-strong:#94533a;--accent-soft:#fbeae1;--on-accent:#fff;
  --rose:#efc4c4;--rose-tint:#fbeeee;--rose-text:#94464c;
  --mauve:#f2dcc6;--mauve-tint:#fbf2e9;--mauve-text:#7b522f;
  --peri:#cfe0d6;--peri-tint:#eef6f1;--peri-text:#426855;
  --input-bg:#fff;--gray-bg:#f6efea;--gray-text:#62554d;--empty:#bdaea4;
}
[data-theme="sky"]{
  --bg:#f3f7fb;--surface:#fff;--line:#dfe8f1;--text:#2a3542;--muted:#5f6b7a;
  --accent:#6592c4;--accent-strong:#3f6894;--accent-soft:#e6eff9;--on-accent:#fff;
  --rose:#ecc8cf;--rose-tint:#faedf0;--rose-text:#8f4a5a;
  --mauve:#cfdcef;--mauve-tint:#eef3fa;--mauve-text:#455b7c;
  --peri:#c7e3e0;--peri-tint:#ecf6f5;--peri-text:#376560;
  --input-bg:#fff;--gray-bg:#edf2f7;--gray-text:#505b68;--empty:#a6b2be;
}
[data-theme="beige"]{
  --bg:#f8f5ef;--surface:#fff;--line:#e9e2d6;--text:#38322a;--muted:#6c6557;
  --accent:#9e8762;--accent-strong:#6e5b3c;--accent-soft:#f1ebdf;--on-accent:#fff;
  --rose:#e8c9bd;--rose-tint:#f9eee9;--rose-text:#8b4f3f;
  --mauve:#e3d7c2;--mauve-tint:#f5f0e6;--mauve-text:#695839;
  --peri:#cdd9cc;--peri-tint:#eef3ed;--peri-text:#475f48;
  --input-bg:#fff;--gray-bg:#f1ede5;--gray-text:#5a5347;--empty:#b6ad9e;
}
/* 다크 모드. 인쇄할 때는 밝은 기본 테마로 돌아가도록 screen에서만 적용 */
@media screen{
  [data-theme="dark"]{
    color-scheme:dark;
    --bg:#15131b;--surface:#1f1c27;--line:#36313f;--text:#ece8f3;--muted:#a59eb6;
    --accent:#a593e6;--accent-strong:#c9befa;--accent-soft:#2d2740;--on-accent:#16131d;
    --rose:#8a5268;--rose-tint:#3a2430;--rose-text:#f3b6ca;
    --mauve:#54476c;--mauve-tint:#29233a;--mauve-text:#d2bff0;
    --peri:#4a5a8a;--peri-tint:#1f2840;--peri-text:#aec0f3;
    --input-bg:#18151f;--gray-bg:#2a2733;--gray-text:#c2bcd0;--empty:#6a637a;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
@media screen and (prefers-color-scheme:dark){
  [data-theme="auto"]{
    color-scheme:dark;
    --bg:#15131b;--surface:#1f1c27;--line:#36313f;--text:#ece8f3;--muted:#a59eb6;
    --accent:#a593e6;--accent-strong:#c9befa;--accent-soft:#2d2740;--on-accent:#16131d;
    --rose:#8a5268;--rose-tint:#3a2430;--rose-text:#f3b6ca;
    --mauve:#54476c;--mauve-tint:#29233a;--mauve-text:#d2bff0;
    --peri:#4a5a8a;--peri-tint:#1f2840;--peri-text:#aec0f3;
    --input-bg:#18151f;--gray-bg:#2a2733;--gray-text:#c2bcd0;--empty:#6a637a;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}

/* ===== 기본 ===== */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI","Malgun Gothic",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--accent-strong)}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--input-bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:22px;height:22px;padding:0;flex:none;accent-color:var(--accent-strong);cursor:pointer;box-shadow:none}
textarea{resize:vertical;line-height:1.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:20px;height:20px;display:inline-block;flex:none}
.icon svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.grow{flex:1;min-width:0}
.empty{color:var(--empty)}

/* ===== 레이아웃: 휴대폰은 아래 탭, 넓은 화면은 왼쪽 메뉴 ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;font-size:.75rem;font-weight:600;color:var(--muted);text-align:center}
.nav-item .icon{width:24px;height:24px}
.nav-item.on{color:var(--accent-strong)}
.nav-brand,.nav-foot,.nav-item.desk{display:none}
.main{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:860px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:10px 0;background:var(--bg)}
.trip-switch{display:flex;align-items:center;gap:6px;min-width:0;flex:1;font-weight:800;font-size:1.15rem;padding:6px 8px;margin-left:-8px;border-radius:10px;letter-spacing:-.01em}
.trip-switch:hover{background:var(--accent-soft)}
.trip-switch .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-switch .icon{width:18px;height:18px;color:var(--muted)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--text)}
.icon-btn:hover{background:var(--accent-soft)}
.top-export .lbl{display:none}
@media (min-width:880px){
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:22px 14px;gap:2px}
  .nav-brand{display:block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 12px 14px}
  .nav-item,.nav-item.desk{display:flex;flex:none;flex-direction:row;gap:12px;padding:11px 12px;border-radius:12px;font-size:.98rem}
  .nav-item:hover{background:var(--gray-bg)}
  .nav-item.on{background:var(--accent-soft)}
  .nav-item .icon{width:22px;height:22px}
  .nav-foot{display:block;margin-top:auto;padding:12px;font-size:.8rem;color:var(--muted);line-height:1.5}
  .main{padding:0 36px 56px}
  .topbar{padding:16px 0 12px}
  .topbar .only-mobile{display:none}
  .top-export .lbl{display:inline}
}

/* ===== 공통 요소 ===== */
.page-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px}
.page-title h2{font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card>h3{font-size:1rem;font-weight:700;margin-bottom:10px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head h3{font-size:1rem;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:.95rem;background:var(--accent-soft);color:var(--accent-strong);white-space:nowrap;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent-strong);color:var(--on-accent)}
.btn.danger{background:var(--rose-tint);color:var(--rose-text)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.875rem;border-radius:10px}
.btn.block{width:100%}
.btn .icon{width:18px;height:18px}
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;border:1.5px dashed var(--line);border-radius:14px;color:var(--accent-strong);font-weight:700;background:transparent}
.add-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--gray-bg);color:var(--gray-text);white-space:nowrap}
.chip.low{background:var(--peri-tint);color:var(--peri-text)}
.chip.mid{background:var(--mauve-tint);color:var(--mauve-text)}
.chip.high{background:var(--rose-tint);color:var(--rose-text)}
.chip.now{background:var(--accent-strong);color:var(--on-accent)}
.warn{font-size:.875rem;color:var(--rose-text);background:var(--rose-tint);border-radius:10px;padding:6px 10px}
.hint{font-size:.875rem;color:var(--muted);margin-bottom:10px}
.progress{height:8px;border-radius:99px;background:var(--gray-bg);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.seg{display:flex;background:var(--gray-bg);border-radius:14px;padding:4px;gap:4px;margin:14px 0}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:700;font-size:.92rem;color:var(--muted);text-align:center}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg small{font-weight:600;opacity:.8;margin-left:3px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:0}
button.row:hover,.row.click:hover{background:var(--gray-bg);border-radius:10px}
.row.click{cursor:pointer}
.row-t{font-weight:600}
.row .amt{font-weight:700;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.row.on{background:var(--accent-soft);border-radius:10px}
.empty-state{text-align:center;padding:28px 12px;color:var(--muted)}
.empty-state b{display:block;color:var(--text);font-size:1.02rem;margin-bottom:4px}

/* ===== 요약 (상단) ===== */
.hero{border-radius:22px;padding:18px;background:linear-gradient(135deg,var(--mauve-tint),var(--peri-tint));border:1px solid var(--line);margin:4px 0 14px}
.hero-route{font-size:.9rem;color:var(--muted);margin-bottom:4px}
.hero-dates{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.hero .lbl{font-size:.85rem;color:var(--muted);font-weight:600}
.hero .big{font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px;margin-top:14px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:600}
.kpi .v{font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.kpi .s{font-size:.8rem;color:var(--muted)}
.jump{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-bottom:4px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.jump button:hover{border-color:var(--accent)}

/* ===== 일정 타임라인 ===== */
.country-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 0 10px;scroll-margin-top:72px}
.country-head h3{font-size:1.05rem;font-weight:800}
.stop{display:grid;grid-template-columns:34px 1fr;gap:10px}
.rail{display:flex;flex-direction:column;align-items:center}
.rail::after{content:"";flex:1;width:2px;background:var(--line);margin-top:4px}
.stop:last-child .rail::after{display:none}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:var(--surface);border:2px solid var(--mauve);color:var(--mauve-text);flex:none}
.stop.low .dot{border-color:var(--peri);color:var(--peri-text)}
.stop.high .dot{border-color:var(--rose);color:var(--rose-text)}
.stop.now .dot{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.stop-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;margin-bottom:2px;transition:border-color .15s}
.stop-card:hover{border-color:var(--accent)}
.stop.now .stop-card{border-color:var(--accent-strong);box-shadow:0 0 0 2px var(--accent-soft)}
.stop-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.stop-top h4{font-size:1.08rem;font-weight:800;letter-spacing:-.01em}
.stop-when{font-size:.875rem;color:var(--muted);font-weight:600;white-space:nowrap}
.stop-area{font-size:.9rem;color:var(--muted)}
.todos{list-style:none;display:flex;flex-direction:column;gap:3px;font-size:.92rem}
.todos li{padding-left:16px;position:relative}
.todos li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.leg{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:stretch}
.leg .line{display:block;justify-self:center;width:2px;background:var(--line)}
.leg-btn{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:.875rem;color:var(--muted);padding:8px 10px;margin:4px 0;border-radius:10px;width:100%}
.leg-btn:hover{background:var(--gray-bg)}
.leg-mode{font-weight:700;color:var(--text)}
.leg.warn .leg-btn{color:var(--rose-text)}
.leg-warn{display:block;width:100%;font-weight:600}
.leg.none .leg-btn{color:var(--accent-strong);font-weight:600;opacity:.8}

/* ===== 예산 ===== */
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--gray-bg);margin:16px 0 12px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.legend .lg-l{font-size:.8rem;color:var(--muted);font-weight:600}
.legend .lg-v{font-weight:800}
.legend .lg-p{font-size:.8rem;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.bar-row:last-child{border-bottom:0}
.bar-row .progress{grid-column:1/-1;height:6px}
.bar-row .progress i{background:var(--peri)}

/* ===== 가계부 ===== */
.amount-in{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:4px 14px;background:var(--input-bg)}
.amount-in:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.amount-in span{font-weight:800;color:var(--muted);font-size:1.1rem}
.amount-in input{border:0;box-shadow:none!important;font-size:1.6rem;font-weight:800;padding:8px 0;background:transparent}
.cat-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.pick{min-height:42px;border-radius:12px;border:1px solid var(--line);font-size:.9rem;font-weight:600;background:var(--surface);text-align:center;padding:0 8px}
.pick.on{background:var(--accent-soft);border-color:var(--accent-strong);color:var(--accent-strong)}
.chip-pick{display:flex;flex-wrap:wrap;gap:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.day-head{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;color:var(--muted);margin:16px 2px 4px}
.cat-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--gray-bg);flex:none;font-size:1.1rem}

/* ===== 준비 ===== */
.check{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-of-type{border-bottom:0}
.check input{margin-top:1px}
.check .t{flex:1}
.check.done .t{text-decoration:line-through;color:var(--muted)}
.check-edit{display:flex;gap:8px;align-items:center;padding:6px 0}
.group-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.group-head h3{flex:1;font-size:1rem;font-weight:700}
.group-head .cnt{font-size:.85rem;color:var(--muted);font-weight:700}
.group .progress{margin-bottom:6px;height:6px}
.add-line{display:flex;gap:8px;margin-top:10px}
.add-line input{border-style:dashed}
.booking{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
.booking:last-child{border-bottom:0}
.booking .body{flex:1;cursor:pointer}
.booking.done .row-t{text-decoration:line-through;color:var(--muted)}

/* ===== 정보 ===== */
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.country-grid .card{margin:0}
.info-line{display:flex;gap:10px;padding:5px 0;font-size:.92rem}
.info-line .k{width:68px;flex:none;color:var(--muted);font-weight:600}
.info-line a{font-weight:700}
.notes{min-height:280px}
.save-state{font-size:.8rem;color:var(--muted)}

/* ===== 설정 ===== */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px;font-size:.875rem;font-weight:600;color:var(--muted)}
.fld small{font-weight:500}
.fld-check{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:600;color:var(--text);cursor:pointer;padding:4px 0}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}

/* ===== 시트 (편집 창) ===== */

dialog.sheet::backdrop{background:rgba(20,16,30,.45)}

.sheet-sec h4{font-size:.95rem;font-weight:800;margin-bottom:2px}

.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin-bottom:12px}
.big-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--surface)}
.big-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.big-btn .em{font-size:1.5rem;width:36px;text-align:center}
.big-btn b{display:block;font-size:1rem}
.big-btn small{color:var(--muted);font-size:.85rem}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:100}
.toast.show{opacity:1;transform:translate(-50%,0)}

#report{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff}
  .app,dialog,.toast{display:none!important}
  #report{display:block}
  #report .report{padding:0;max-width:none}
}

/* ============ 저장 ============ */
let store, trip;

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.trips && Object.keys(s.trips).length) return s; }
  } catch (e) {}
  const t = sampleTrip();
  // 이전 버전(v6) 가계부·메모가 있으면 옮겨오기
  try {
    const oldLedger = localStorage.getItem('ledger_entries_v6');

  const transport = trip.routes.reduce((a, r) => a + num(r.cost), 0);

  const spent = trip.ledger.reduce((a, l) => a + num(l.amount), 0);
  const spentHome = trip.ledger.reduce((a, l) => a + num(l.amount) * (num(l.fx) || num(trip.meta.fx)), 0);

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return e;
}

function schedule() {
  let acc = 0;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return trip.cities.map(c => {
    const n = num(c.nights), arr = addDays(trip.meta.startDate, acc), dep = addDays(trip.meta.startDate, acc + n);

const normName = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim();

  const used = new Set(), between = [];
  for (let i = 0; i < trip.cities.length - 1; i++) {
    const A = trip.cities[i], B = trip.cities[i + 1];
    const r = trip.routes.find(r => !used.has(r) && sameCity(r.from, A.name) && sameCity(r.to, B.name));

function control(f, d) {
  const full = f.full ? ' full' : '';
  if (f.type === 'checkbox') {
    const cb = h('input', { type: 'checkbox' }); cb.checked = !!d[f.key];
    cb.addEventListener('change', () => d[f.key] = cb.checked);
    return { wrap: h('label', { class: 'fld-check' + full }, cb, h('span', {}, f.label)) };
  }
  if (f.type === 'chips') {
    const box = h('div', { class: 'chip-pick' });
    const draw = () => {
      box.innerHTML = '';
      f.options.forEach(o => {
        const v = typeof o === 'string' ? o : o.v, l = typeof o === 'string' ? o : o.l;
        box.append(h('button', { type: 'button', class: 'pick' + (d[f.key] === v ? ' on' : ''), onclick: () => { d[f.key] = v; draw(); } }, l));
      });
    };
    draw();
    return { wrap: h('div', { class: 'fld' + full }, h('span', {}, f.label), box) };
  }
  let input, dl = null;
  if (f.type === 'textarea') input = h('textarea', { rows: f.rows || 4, placeholder: f.ph || '' });
  else {
    input = h('input', { type: f.type === 'date' ? 'date' : 'text', placeholder: f.ph || '' });
    if (f.type === 'number') input.setAttribute('inputmode', 'decimal');
    if (f.list) { const id = 'dl-' + f.key; input.setAttribute('list', id); dl = h('datalist', { id }, [...new Set(f.list)].map(x => h('option', { value: x }))); }
  }
  input.value = d[f.key] ?? '';
  input.addEventListener('input', () => {
    const v = input.value;
    if (f.type === 'number') { if (v.trim() === '') d[f.key] = ''; else if (!isNaN(parseFloat(v))) d[f.key] = parseFloat(v); }
    else d[f.key] = v;
  });
  return { wrap: h('label', { class: 'fld' + full }, h('span', {}, f.label), input, dl, f.hint ? h('small', {}, f.hint) : null), input };
}
/* 항목 하나를 편집하는 창. 저장을 눌러야 반영되고, 취소하면 그대로 */
function editForm({ title, obj, fields, list, isNew, order = true, onDelete, deleteMsg, after }) {
  const d = JSON.parse(JSON.stringify(obj));
  const form = h('div', { class: 'form' });
  let first = null;
  fields.forEach(f => { const c = control(f, d); form.append(c.wrap); if (!first && c.input) first = c.input; });
  let pos = null;
  const max = list ? list.length + (isNew ? 1 : 0) : 0, orig = list && !isNew ? list.indexOf(obj) : -1;
  if (list && order && max > 1) {
    pos = isNew ? max : list.indexOf(obj) + 1;
    const inp = h('input', { type: 'text', inputmode: 'numeric', value: pos });
    inp.addEventListener('input', () => { pos = parseInt(inp.value, 10); });
    form.append(h('label', { class: 'fld' }, h('span', {}, '순서 (1~' + max + '번째)'), inp));
  }
  const doSave = () => {
    Object.assign(obj, d);
    if (list) {
      if (!isNew) list.splice(orig, 1);
      // 순서 칸이 없거나 비어 있으면: 새 항목은 맨 뒤, 기존 항목은 원래 자리
      const p = pos == null || isNaN(pos) ? (isNew ? list.length : orig) : Math.min(Math.max(1, pos), max) - 1;
      list.splice(p, 0, obj);
    }
    if (after) after(obj);
    save(); closeSheet(); render(); toast(isNew ? '추가했습니다' : '저장했습니다');
  };
  form.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && !e.isComposing) { e.preventDefault(); doSave(); }
  });
  openSheet(title, form, [
    !isNew && onDelete ? h('button', { type: 'button', class: 'btn danger', onclick: () => {
      if (!confirm(deleteMsg || '삭제할까요?')) return;
      onDelete(); save(); closeSheet(); render(); toast('삭제했습니다');
    } }, icon('trash'), '삭제') : null,
    h('span', { class: 'grow' }),
    btn('취소', closeSheet, 'ghost'),
    btn(isNew ? '추가' : '저장', doSave, 'primary')
  ]);
  if (isNew && first) setTimeout(() => first.focus(), 60);
}

      h('div', {}, h('div', { class: 'row-t' }, k), h('div', { class: 'muted small' }, x.cities + '곳 · ' + x.nights + '박 · 하루 ' + (x.nights ? fmtBase(x.sum / x.nights) : '-'))),
      h('div', { class: 'amt', style: 'text-align:right' }, h('div', { class: 'row-t' }, fmtBase(x.sum)), h('div', { class: 'muted small' }, fmtHome(x.sum * fx))),

  v.append(h('p', { class: 'hint' }, '환율 1 ' + m.baseCur + ' = ' + fx.toLocaleString() + ' ' + m.homeCur + (m.fxUpdated ? ' (' + m.fxUpdated + ')' : ' (직접 입력)') + ' · ',

/* --- 가계부 --- */
let draft = null;
function viewLedger(v) {
  const m = trip.meta, t = totals(), fx = num(m.fx);
  const nowCity = (schedule().find(s => s.now) || {}).c;
  const lastCity = trip.ledger.length ? trip.ledger[trip.ledger.length - 1].city : '';
  if (!draft || draft.tripId !== trip.id) draft = { tripId: trip.id, date: todayStr(), city: nowCity ? nowCity.name : (lastCity && lastCity !== '-' ? lastCity : ''), cat: '식비', fx: '' };
  const pct = t.grand ? Math.min(100, t.spent / t.grand * 100) : 0;
  v.append(h('section', { class: 'hero' },
    h('div', { class: 'lbl' }, '지금까지 쓴 돈'),
    h('div', { class: 'big' }, fmtBase(t.spent)),
    h('div', { class: 'muted' }, fmtHome(t.spentHome) + ' · 예산 ' + fmtBase(t.grand) + '의 ' + Math.round(pct) + '%'),
    h('div', { class: 'progress', style: 'margin:14px 0 10px;height:10px' }, h('i', { style: 'width:' + pct + '%' })),
    h('div', { class: 'small' }, '남은 예산 ', h('b', {}, fmtBase(t.grand - t.spent)), h('span', { class: 'muted' }, ' · ' + fmtHome(t.grand * fx - t.spentHome)))));

  // 빠른 입력
  const amt = h('input', { type: 'text', inputmode: 'decimal', placeholder: '0', 'aria-label': '금액', 'data-focus': 'amount' });
  const desc = h('input', { type: 'text', placeholder: '내용 (예: 점심, 호스텔 2박)', 'aria-label': '내용' });
  const city = h('input', { type: 'text', placeholder: '도시', list: 'ledger-cities', value: draft.city, 'aria-label': '도시' });
  const date = h('input', { type: 'date', value: draft.date, 'aria-label': '날짜' });
  const rate = h('input', { type: 'text', inputmode: 'decimal', value: draft.fx || fx, 'aria-label': '환율' });
  city.addEventListener('input', () => draft.city = city.value);
  date.addEventListener('input', () => draft.date = date.value);
  rate.addEventListener('input', () => draft.fx = rate.value);
  const cats = h('div', { class: 'cat-pick', role: 'radiogroup', 'aria-label': '분류' });
  const drawCats = () => { cats.innerHTML = ''; CATS.forEach(c => cats.append(h('button', { type: 'button', class: 'pick' + (draft.cat === c ? ' on' : ''), 'aria-pressed': draft.cat === c ? 'true' : 'false', onclick: () => { draft.cat = c; drawCats(); } }, CAT_ICON[c] + ' ' + c))); };
  drawCats();
  const add = () => {
    const a = parseFloat(amt.value);
    if (!(a > 0)) { amt.focus(); toast('금액을 입력하세요'); return; }
    trip.ledger.push({ id: uid(), date: date.value || todayStr(), city: city.value.trim(), cat: draft.cat, desc: desc.value.trim() || draft.cat, amount: a, fx: parseFloat(rate.value) || fx });
    save(); focusAfter = 'amount'; render(); toast(fmtBase(a) + ' 기록했습니다');
  };
  [amt, desc].forEach(x => x.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(); } }));
  v.append(h('div', { class: 'card' }, h('h3', {}, '지출 기록하기'),
    h('div', { class: 'amount-in' }, h('span', {}, m.baseCur === 'USD' ? '$' : m.baseCur), amt),
    cats, h('div', { class: 'form-row' }, h('div', { style: 'grid-column:1/-1' }, desc)),
    h('div', { class: 'form-row' }, city, date),
    h('datalist', { id: 'ledger-cities' }, trip.cities.map(c => h('option', { value: c.name }))),
    h('details', { style: 'margin-bottom:10px' }, h('summary', { class: 'muted small', style: 'cursor:pointer' }, '환율 (1 ' + m.baseCur + ' = ' + num(draft.fx || fx).toLocaleString() + ' ' + m.homeCur + ')'), h('div', { style: 'margin-top:8px' }, rate)),
    h('button', { type: 'button', class: 'btn primary block', onclick: add }, '기록하기')));

  // 분류별 합계
  const byCat = {};
  trip.ledger.forEach(l => byCat[l.cat] = (byCat[l.cat] || 0) + num(l.amount));
  if (Object.keys(byCat).length) v.append(h('div', { class: 'chips', style: 'margin:4px 0 6px' },
    Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([k, x]) => h('span', { class: 'chip' }, (CAT_ICON[k] || '') + ' ' + k + ' ' + fmtBase(x)))));

  // 날짜별 목록
  v.append(h('div', { class: 'page-title' }, h('h2', {}, '기록'), h('span', { class: 'muted small' }, trip.ledger.length + '건')));
  if (!trip.ledger.length) { v.append(h('div', { class: 'card' }, emptyState('아직 기록이 없어요', '위에서 금액을 넣고 기록하기를 누르세요.'))); return; }
  const days = {};
  trip.ledger.map((l, i) => ({ l, i })).sort((a, b) => (b.l.date || '').localeCompare(a.l.date || '') || b.i - a.i)
    .forEach(({ l }) => (days[l.date || '날짜 없음'] = days[l.date || '날짜 없음'] || []).push(l));

  Object.entries(days).forEach(([d, list]) => {
    const dt = addDays(d, 0);
    card.append(h('div', { class: 'day-head' }, h('span', {}, dt ? ymd(dt) + ' ' + WD[dt.getDay()] + '요일' : d), h('span', {}, fmtBase(list.reduce((a, l) => a + num(l.amount), 0)))));
    card.append(h('div', { class: 'rows' }, list.map(l => h('button', { type: 'button', class: 'row', onclick: () => editEntry(l) },
      h('span', { class: 'cat-ic' }, CAT_ICON[l.cat] || '🧾'),
      h('div', { class: 'grow' }, h('div', { class: 'row-t' }, l.desc || l.cat), h('div', { class: 'muted small' }, [l.cat, l.city && l.city !== '-' ? l.city : ''].filter(Boolean).join(' · '))),
      h('div', { class: 'amt' }, fmtBase(num(l.amount)), h('small', {}, fmtHome(num(l.amount) * (num(l.fx) || fx))))))));
  });
  v.append(card);
}

  const subs = [['bookings', '예약', [trip.bookings.filter(b => b.done).length, trip.bookings.length]], ['prep', '할 일', cnt('prep')], ['pack', '짐', cnt('pack')]];
  v.append(h('div', { class: 'seg', role: 'tablist' }, subs.map(([id, l, c]) => h('button', { type: 'button', role: 'tab', 'aria-selected': prepSub === id ? 'true' : 'false', class: prepSub === id ? 'on' : '', onclick: () => { prepSub = id; render(); } }, l, h('small', {}, c[0] + '/' + c[1])))));
  if (prepSub === 'bookings') return prepBookings(v);
  const groups = trip.checklists.filter(g => g.tab === prepSub);
  const all = groups.flatMap(g => g.items);

    + $('#report-css').textContent
    + '\n.report{margin:24px auto;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.06)}\n@media print{body{background:#fff}.report{margin:0;box-shadow:none;padding:0}@page{margin:14mm}}\n@media (max-width:640px){.report{margin:0;border-radius:0}}\n</style>\n</head>\n<body>\n'
    + node.outerHTML + '\n</body>\n</html>\n';
  downloadBlob(doc, 'text/html', safeName(trip.meta.title) + '_일정표.html');
  closeSheet(); toast('HTML 파일을 저장했습니다');
}
function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function buildReport() { const r = $('#report'); r.innerHTML = ''; r.append(reportNode(reportOpts)); }
window.addEventListener('beforeprint', buildReport);   // ⌘P로 바로 인쇄해도 문서가 나오도록

function reportNode(o) {
  const m = trip.meta, t = totals(), fx = num(m.fx), sch = schedule();
  const start = addDays(m.startDate, 0), end = addDays(m.startDate, t.nights);
  const tbl = (head, rows, foot, cls) => h('div', { class: 'tw' }, h('table', { class: cls || null },
    h('thead', {}, h('tr', {}, head.map(x => h('th', { class: x[1] || '' }, x[0])))), h('tbody', {}, rows), foot ? h('tfoot', {}, foot) : null));
  const r = h('article', { class: 'report' });
  r.append(h('header', {}, h('h1', {}, m.title || '여행'), m.subtitle ? h('p', { class: 'r-sub' }, m.subtitle) : null,
    h('p', { class: 'r-meta' }, [start ? ymd(start) + ' – ' + ymd(end) : '출발일 미정', t.nights + '박', trip.cities.length + '개 도시', t.countries.length + '개국'].join(' · '))));
  r.append(h('div', { class: 'r-kpis' }, [['총 예산', fmtBase(t.grand), fmtHome(t.grand * fx)], ['하루 평균', t.nights ? fmtBase(t.grand / t.nights) : '-', ''],
    ['체류비', fmtBase(t.ground), ''], ['이동비', fmtBase(t.transport), ''], ['기타 고정비', fmtBase(t.fixed), '']].map(([l, v, s]) =>
    h('div', { class: 'r-kpi' }, h('div', { class: 'l' }, l), h('div', { class: 'v' }, v), s ? h('div', { class: 's' }, s) : null))));

  if (o.plan && trip.cities.length) {
    const { between, loose } = linkRoutes();
    const rows = [];
    sch.forEach((s, i) => {
      const c = s.c, todos = lines(c.todos);
      rows.push(h('tr', {}, h('td', { class: 'n c-n' }, i + 1), h('td', { class: 'nw c-d' }, s.arr ? mdw(s.arr) + ' – ' + mdw(s.dep) : ''),
        h('td', { class: 'c-c' }, h('b', {}, c.name || '(이름 없음)'), h('br'), h('span', { class: 'r-todo' }, [c.country, c.base].filter(Boolean).join(' · ')),
          cityWarnings(c).map(w => h('div', { class: 'r-warn r-todo' }, '⚠ ' + w))),
        h('td', { class: 'n c-k' }, s.n), h('td', { class: 'n c-p' }, fmtBase(num(c.daily))),
        h('td', { class: 'r-todo c-t' }, todos.join(' · '))));
      const rt = between[i];
      if (rt) rows.push(h('tr', { class: 'leg' + (routeWarning(rt) ? ' w' : '') }, h('td', { colspan: 6 }, '↓ ' + MODE_ICON[rt.mode] + ' ' + rt.mode + (routeText(rt) ? ' · ' + routeText(rt) : '') + (routeWarning(rt) ? '  ⚠ ' + routeWarning(rt) : ''))));
    });
    r.append(h('h2', {}, '일정'), tbl([['#', 'n'], ['날짜'], ['도시'], ['박', 'n'], ['하루', 'n'], ['할 일 · 갈 곳']], rows, null, 'r-plan'));
    if (loose.length) r.append(h('h3', {}, '기타 이동'), tbl([['구간'], ['수단'], ['메모 · 시간 · 비용']],
      loose.map(x => h('tr', {}, h('td', {}, (x.from || '?') + ' → ' + (x.to || '?')), h('td', { class: 'nw' }, MODE_ICON[x.mode] + ' ' + x.mode), h('td', {}, routeText(x))))));
  }
  if (o.budget) {
    const byC = {};
    trip.cities.forEach(c => { const k = (c.country || '국가 미입력').trim(); byC[k] = byC[k] || { n: 0, s: 0 }; byC[k].n += num(c.nights); byC[k].s += num(c.nights) * num(c.daily); });
    r.append(h('h2', {}, '예산'),
      tbl([['나라'], ['박', 'n'], ['하루 평균', 'n'], ['체류비', 'n'], [m.homeCur, 'n']],
        Object.entries(byC).map(([k, x]) => h('tr', {}, h('td', {}, k), h('td', { class: 'n' }, x.n), h('td', { class: 'n' }, x.n ? fmtBase(x.s / x.n) : '-'), h('td', { class: 'n' }, fmtBase(x.s)), h('td', { class: 'n' }, fmtHome(x.s * fx)))),
        h('tr', {}, h('td', {}, '체류비 합계'), h('td', { class: 'n' }, t.nights), h('td', {}), h('td', { class: 'n' }, fmtBase(t.ground)), h('td', { class: 'n' }, fmtHome(t.ground * fx)))),
      tbl([['항목'], ['금액', 'n'], [m.homeCur, 'n']],
        [h('tr', {}, h('td', {}, '이동비 (' + trip.routes.length + '건)'), h('td', { class: 'n' }, fmtBase(t.transport)), h('td', { class: 'n' }, fmtHome(t.transport * fx))),
          ...trip.costs.map(c => h('tr', {}, h('td', {}, c.label), h('td', { class: 'n' }, num(c.amount) ? fmtBase(num(c.amount)) : '미입력'), h('td', { class: 'n' }, fmtHome(num(c.amount) * fx))))],
        h('tr', {}, h('td', {}, '총 예산'), h('td', { class: 'n' }, fmtBase(t.grand)), h('td', { class: 'n' }, fmtHome(t.grand * fx)))),
      h('p', { class: 'r-todo' }, '환율 1 ' + m.baseCur + ' = ' + fx.toLocaleString() + ' ' + m.homeCur + (m.fxUpdated ? ' (' + m.fxUpdated + ')' : '')));
  }
  if (o.prep) {
    if (trip.bookings.length) r.append(h('h2', {}, '미리 예약할 것'), tbl([['', ''], ['항목'], ['나라'], ['언제'], ['메모']],
      trip.bookings.map(b => h('tr', {}, h('td', {}, b.done ? '☑' : '☐'), h('td', {}, b.item), h('td', {}, b.country), h('td', {}, b.when), h('td', { class: 'r-todo' }, b.memo)))));
    [['prep', '준비할 일'], ['pack', '짐']].forEach(([tab, label]) => {
      const gs = trip.checklists.filter(g => g.tab === tab);
      if (gs.length) r.append(h('h2', {}, label), h('div', { class: 'r-groups' }, gs.map(g => h('div', { class: 'r-group' }, h('h3', {}, g.title),
        h('ul', { class: 'r-check' }, g.items.map(it => h('li', { class: it.done ? 'd' : '' }, (it.done ? '☑ ' : '☐ ') + it.text)))))));
    });
  }
  if (o.info && trip.countries.length) r.append(h('h2', {}, '나라별 정보'), tbl([['나라'], ['긴급번호'], ['통화'], ['결제'], ['치안 · 여행경보']],
    trip.countries.map(c => h('tr', {}, h('td', {}, h('b', {}, c.name)), h('td', {}, c.emergency), h('td', {}, c.currency), h('td', {}, c.payment), h('td', { class: c.advisory ? 'r-warn' : '' }, c.advisory)))));
  if (o.notes && (trip.notes || '').trim()) r.append(h('h2', {}, '메모'), h('div', { class: 'r-notes' }, trip.notes));
  if (o.ledger && trip.ledger.length) r.append(h('h2', {}, '가계부'), tbl([['날짜'], ['도시'], ['분류'], ['내용'], ['금액', 'n'], [m.homeCur, 'n']],
    trip.ledger.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(l => h('tr', {}, h('td', { class: 'nw' }, l.date), h('td', {}, l.city), h('td', {}, l.cat), h('td', {}, l.desc), h('td', { class: 'n' }, fmtBase(num(l.amount))), h('td', { class: 'n' }, fmtHome(num(l.amount) * (num(l.fx) || fx))))),
    h('tr', {}, h('td', { colspan: 4 }, '합계'), h('td', { class: 'n' }, fmtBase(t.spent)), h('td', { class: 'n' }, fmtHome(t.spentHome)))));
  r.append(h('p', { class: 'r-foot' }, new Date().toLocaleDateString('ko-KR') + ' 기준 · Trip Planner'));
  return r;
}

/* ============ 가져오기 ============ */
function normalizeTrip(t) {
  if (!t || !t.meta || !Array.isArray(t.cities)) return null;
  const base = blankTrip();
  const out = Object.assign(base, t, { meta: Object.assign(base.meta, t.meta) });
  if (!out.id) out.id = uid();
  return out;
}
function addImported(t, log) {
  const ex = store.trips[t.id];
  if (ex) {
    const keep = confirm('"' + (ex.meta.title || '') + '" 여행이 이미 이 기기에 있습니다.\n\n확인: 가져온 파일로 덮어쓰기\n취소: 사본으로 따로 추가');
    if (!keep) { t.id = uid(); t.meta.title = (t.meta.title || '여행') + ' (가져옴)'; log.push('사본 추가: ' + t.meta.title); }
    else log.push('덮어씀: ' + t.meta.title);
  } else log.push('추가: ' + t.meta.title);
  store.trips[t.id] = t;
  return t.id;
}
async function importFiles(input) {
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;
  const log = [], bad = [];
  let lastId = null;
  for (const f of files) {
    try {
      const d = JSON.parse(await f.text());
      let list = [];
      if (d && d.type === 'backup' && Array.isArray(d.trips)) list = d.trips;
      else if (d && d.type === 'trip' && d.trip) list = [d.trip];
      else list = [d];                       // 예전 형식 (여행 객체만 있는 파일)
      const valid = list.map(normalizeTrip).filter(Boolean);
      if (!valid.length) throw new Error();
      valid.forEach(t => lastId = addImported(t, log));
    } catch (e) { bad.push(f.name); }
  }
  if (lastId) switchTrip(lastId);
  alert((log.length ? log.join('\n') : '가져온 여행 없음') + (bad.length ? '\n\n읽지 못한 파일: ' + bad.join(', ') : ''));
}
document.getElementById('import-file').addEventListener('change', e => importFiles(e.target));

applyTheme(getTheme());
store = loadStore();
trip = store.trips[store.current] || Object.values(store.trips)[0];
store.current = trip.id;
save();
render();
</script>
