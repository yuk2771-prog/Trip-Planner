<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Planner Template</title>
<style>
:root{
  /* 한 계열(블러시 → 모브 → 라벤더 → 페리윙클)의 저채도 파스텔 */
  --bg:#f7f5fa;--surface:#fff;--line:#e8e3ef;--text:#3f3a4d;--muted:#8b859b;
  --accent:#8e7cc3;--accent-strong:#6b5ba3;--accent-soft:#eeeaf8;
  --rose:#e7c8d3;--rose-tint:#f8edf1;--rose-text:#9a5570;
  --mauve:#d8cbe9;--mauve-tint:#f3eef9;--mauve-text:#6d5690;
  --peri:#c9d4ef;--peri-tint:#eef2fb;--peri-text:#4d5e96;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.55;padding:16px}
.container{max-width:1250px;margin:0 auto}
header{text-align:center;padding:28px 16px;background:linear-gradient(120deg,var(--rose-tint),var(--mauve-tint) 50%,var(--peri-tint));border:1px solid var(--line);color:var(--accent-strong);border-radius:20px;margin-bottom:14px}
header h1{font-size:1.6rem;margin-bottom:4px;letter-spacing:-.01em}
header p{font-size:.9rem;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.bar .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
body.editing .bar{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mode-tag{font-size:.78rem;font-weight:700;color:var(--accent-strong);background:var(--accent-soft);padding:4px 10px;border-radius:999px}
.btn{background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:999px;font-weight:600;cursor:pointer;font-size:.85rem;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--accent-strong)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.soft{background:var(--accent-soft);color:var(--accent-strong)}
.btn.soft:hover{background:var(--mauve)}
.btn.rose{background:var(--rose-tint);color:var(--rose-text)}
.btn.rose:hover{background:var(--rose)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent-strong)}
.btn.sm{padding:3px 9px;font-size:.78rem}
select,input,textarea{font-size:.88rem;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);max-width:100%}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:16px;height:16px;padding:0;vertical-align:middle;cursor:pointer;accent-color:var(--accent)}
textarea{width:100%;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--peri);border-radius:14px;padding:12px 16px}
.stat.g{border-top-color:var(--mauve)}.stat.y{border-top-color:var(--accent)}.stat.r{border-top-color:var(--rose)}
.stat .l{font-size:.75rem;color:var(--muted)}
.stat .v{font-size:1.25rem;font-weight:700}
.stat .s{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.tab{padding:8px 15px;font-size:.9rem;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--accent-strong)}
.tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:1.06rem;color:var(--accent-strong);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.hint{font-size:.82rem;color:var(--muted);margin-bottom:10px}
.city-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.city{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--mauve);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.city.low{border-top-color:var(--peri)}.city.mid{border-top-color:var(--mauve)}.city.high{border-top-color:var(--rose)}
.city .top{display:flex;gap:8px;align-items:center}
.city .num{background:var(--accent-soft);color:var(--accent-strong);font-weight:700;border-radius:999px;padding:1px 9px;font-size:.78rem}
.city .name{font-weight:700;font-size:1rem;flex:1;min-width:0}
.city h3.name{font-size:1.05rem}
.city .dates{font-size:.8rem;color:var(--muted);white-space:nowrap}
.city .sub{font-size:.84rem;color:var(--muted)}
.city .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.city label.f{display:flex;flex-direction:column;font-size:.72rem;color:var(--muted);gap:2px}
.city label.f input{width:100%}
.city .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.city ul{padding-left:18px;font-size:.86rem}
.city ul li{margin-bottom:2px}
.city .ctrl{display:flex;gap:4px;justify-content:flex-end}
.badge{font-size:.72rem;padding:2px 8px;border-radius:999px;font-weight:600;display:inline-block}
.b-low{background:var(--peri-tint);color:var(--peri-text)}
.b-mid{background:var(--mauve-tint);color:var(--mauve-text)}
.b-high{background:var(--rose-tint);color:var(--rose-text)}
.b-gray{background:#f3f1f6;color:#5f5a6e}
.warn{font-size:.78rem;color:var(--rose-text);background:var(--rose-tint);border-radius:8px;padding:3px 8px;display:inline-block}
.vtext{white-space:pre-wrap}
.empty{color:#c0bacb}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface)}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line);font-size:.86rem;vertical-align:middle}
th{background:var(--mauve-tint);font-weight:600;white-space:nowrap;color:var(--mauve-text)}
th:first-child{border-top-left-radius:10px}th:last-child{border-top-right-radius:10px}
td input[type=text],td input:not([type]),td input[type=number],td input[type=date],td select{width:100%;min-width:70px}
td.num,th.num{text-align:right}
tfoot td{font-weight:700;background:var(--accent-soft)}
.check-group{margin-bottom:16px}
.check-head{display:flex;gap:8px;align-items:center;background:var(--mauve-tint);padding:6px 10px;border-radius:10px;margin-bottom:8px;font-weight:700;color:var(--mauve-text)}
.check-head .t{flex:1}
.check-head input[type=text]{flex:1;font-weight:700;background:transparent;border-color:transparent}
.check-head input[type=text]:focus{background:#fff;border-color:var(--line)}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}
.check-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);cursor:pointer}
.check-item.done{background:var(--peri-tint)}
.check-item input[type=text]{flex:1;border-color:transparent;padding:2px 6px}
.check-item input[type=text]:focus{border-color:var(--line)}
.check-item.done .txt,.check-item.done input[type=text]{text-decoration:line-through;color:var(--muted);background:transparent}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.form-grid label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:3px}
.form-grid label .vtext,.form-grid label>span{color:var(--text);font-size:.95rem}
.ledger-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;background:var(--mauve-tint);padding:12px;border-radius:12px;margin-bottom:12px}
#notes-area{min-height:360px;font-size:.95rem;line-height:1.6}
.notes-view{min-height:120px;font-size:.95rem;line-height:1.7}
footer{text-align:center;padding:16px;color:var(--muted);font-size:.8rem;margin-top:20px}
@media (max-width:600px){body{padding:10px}.city .row{grid-template-columns:repeat(2,1fr)}header h1{font-size:1.25rem}}
@media print{
  .bar,.tabs,.btn,.no-print{display:none!important}
  body{background:#fff;padding:0}
  input,select,textarea{border:none}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 id="h-title">Trip Planner</h1>
    <p id="h-sub"></p>
  </header>

  <div class="bar">
    <div class="grp" id="mode-grp"></div>
    <div class="grp">
      <select id="trip-select" title="여행 선택"></select>
      <button class="btn soft trip-btn" onclick="newTrip()">+ 새 여행</button>
      <button class="btn soft trip-btn" onclick="dupTrip()">복제</button>
      <button class="btn rose trip-btn" onclick="delTrip()">삭제</button>
    </div>
    <div class="grp">
      <button class="btn ghost" onclick="exportTrip()" title="지금 보고 있는 여행 하나를 파일로 저장">이 여행 내보내기</button>
      <button class="btn ghost" onclick="exportAll()" title="이 기기의 모든 여행을 파일 하나로 저장">전체 백업</button>
      <button class="btn ghost trip-btn" onclick="document.getElementById('import-file').click()" title="여행 파일이나 전체 백업 파일 불러오기 (여러 개 선택 가능)">가져오기</button>
      <input type="file" id="import-file" accept=".json,application/json" multiple style="display:none" onchange="importFiles(this)">
      <button class="btn ghost" onclick="window.print()">인쇄</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <div id="panes"></div>

  <footer id="footer"></footer>
</div>

<script>
/* ============ 기본 데이터 ============ */
const STORE_KEY = 'tripPlanner_v1';
const uid = () => Math.random().toString(36).slice(2, 10);

function blankTrip() {
  return {
    id: uid(),
    meta: {
      title: '새 여행', subtitle: '', startDate: '',
      baseCur: 'USD', homeCur: 'KRW', fx: 1380, fxUpdated: '',
      minNights: 3, maxNightsNoTrek: 5, maxDayBus: 8, maxNightBus: 10,
      tierLow: 45, tierHigh: 65
    },
    cities: [],
    routes: [],
    costs: [
      { id: uid(), label: '왕복 국제선', amount: 0 },
      { id: uid(), label: '투어 / 액티비티', amount: 0 },
      { id: uid(), label: '여행자 보험', amount: 0 }
    ],
    bookings: [],
    checklists: [
      { id: uid(), tab: 'prep', title: '출발 2~3개월 전', items: [
        'Check passport validity (6+ months)', 'Buy flights', 'Buy travel insurance', 'Check visa / entry rules', 'Check vaccines'
      ].map(t => ({ id: uid(), text: t, done: false })) },
      { id: uid(), tab: 'prep', title: '출발 1주 전', items: [
        'Download offline maps', 'Save copies of passport & insurance', 'Tell bank about travel', 'Get some cash in local currency'
      ].map(t => ({ id: uid(), text: t, done: false })) },
      { id: uid(), tab: 'pack', title: '필수품', items: [
        'Passport & cards', 'Phone, charger, power bank', 'Plug adapter', 'Medicine kit', 'Toiletries'
      ].map(t => ({ id: uid(), text: t, done: false })) },
      { id: uid(), tab: 'pack', title: '옷', items: [
        'T-shirts', 'Pants', 'Underwear & socks', 'Jacket', 'Shoes / sandals'
      ].map(t => ({ id: uid(), text: t, done: false })) }
    ],
    countries: [],
    ledger: [],
    notes: ''
  };
}

function sampleTrip() {
  const t = blankTrip();
  t.meta.title = '22-Week Latin America';
  t.meta.subtitle = 'Mexico → Guatemala → Costa Rica → Ecuador → Peru → Bolivia → Chile → Argentina → Uruguay';
  t.meta.startDate = '2027-09-10';
  const C = (name, country, nights, daily, alt, base, trek, todos) =>

  t.cities = [
    C('Mexico City', 'Mexico', 5, 50, 2240, 'Roma Norte / Condesa', false, ['Historic Center & Zócalo', 'Frida Kahlo Museum (Coyoacán)', 'Teotihuacán day trip', 'Xochimilco']),
    C('Oaxaca', 'Mexico', 4, 50, 1550, 'Centro', false, ['Hierve el Agua', 'Monte Albán', 'Mercado 20 de Noviembre', 'Cooking class']),

    C('Otavalo', 'Ecuador', 3, 42, 2550, 'Center', false, ['Saturday market', 'Laguna Cuicocha hike', 'Peguche waterfall']),

    C('Uyuni (3-day tour)', 'Bolivia', 3, 33, 3660, 'Tour (ends in Atacama)', true, ['Salar de Uyuni', 'Laguna Colorada', 'Geysers']),

    C('Valparaíso', 'Chile', 3, 72, 0, 'Cerro Alegre / Concepción', false, ['Street art walk', 'Funiculars', 'Viña del Mar']),

  const R = (from, to, mode, op, hours, cost) => ({ id: uid(), from, to, mode, op, hours, cost });

    R('Valladolid', 'Bacalar', '버스', 'ADO', 4, 20),
    R('Bacalar', 'Antigua', '항공', 'Bus to CUN 4.5h, CUN→GUA, shuttle 1h', 2, 135),
    R('Antigua', 'Lake Atitlán', '셔틀', 'Tourist shuttle', 3, 20),
    R('Lake Atitlán', 'La Fortuna', '항공', 'Shuttle to GUA, GUA→SJO, bus 4h', 1.5, 145),
    R('La Fortuna', 'Monteverde', '셔틀', 'Jeep-boat-jeep', 3, 30),
    R('Monteverde', 'Manuel Antonio', '셔틀', 'Shared shuttle', 4, 50),
    R('Manuel Antonio', 'Quito', '항공', 'SJO→UIO (Avianca / Copa)', 4, 130),
    R('Quito', 'Otavalo', '버스', 'Terminal Carcelén', 2, 3),
    R('Otavalo', 'Quilotoa', '버스', 'via Quito / Latacunga', 5, 8),

    R('El Calafate', 'El Chaltén', '버스', 'Chaltén Travel', 3, 25),
    R('El Chaltén', 'Bariloche', '항공', 'Bus to FTE 3h, FTE→BRC', 2, 135),

  t.costs = [
    { id: uid(), label: '왕복 국제선 (서울 ↔ 멕시코시티 / 몬테비데오)', amount: 1200 },
    { id: uid(), label: '트레킹 / 투어 (Salkantay, W-Trek, Uyuni 등)', amount: 1200 },

  t.checklists = [

/* ============ 저장 ============ */
let store, trip, activeTab = 'cities', editMode = false, snapshot = null;

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.trips && Object.keys(s.trips).length) return s; }
  } catch (e) {}
  const t = sampleTrip();
  // 이전 버전(v6) 가계부·메모가 있으면 옮겨오기
  try {
    const oldLedger = localStorage.getItem('ledger_entries_v6');
    if (oldLedger) t.ledger = JSON.parse(oldLedger).map(x => ({ id: uid(), date: x.date, city: x.city, cat: x.cat, desc: x.desc, amount: x.amount, fx: x.fx }));
    const oldNotes = localStorage.getItem('custom_trip_notes_v6');
    if (oldNotes) { const d = document.createElement('div'); d.innerHTML = oldNotes; t.notes = d.innerText; }
  } catch (e) {}

}
function save() {
  store.savedAt = new Date().toISOString();

}

/* ============ 기기 ============ */
const DEVICE_KEY = 'tripPlanner_device';
function guessDevice() {
  const u = navigator.userAgent;
  if (/iPhone/.test(u)) return 'iPhone';
  if (/iPad/.test(u)) return 'iPad';
  if (/Android/.test(u)) return 'Android';
  if (/Mac/.test(u)) return 'Mac';
  if (/Windows/.test(u)) return 'Windows';
  return 'device';
}
function deviceName() {
  try { return localStorage.getItem(DEVICE_KEY) || guessDevice(); } catch (e) { return guessDevice(); }
}
function renameDevice() {
  const n = prompt('이 기기의 이름 (예: 맥북, 아이폰)', deviceName());
  if (n && n.trim()) { try { localStorage.setItem(DEVICE_KEY, n.trim()); } catch (e) {} renderFooter(); }
}

}

/* ============ 계산 ============ */
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
function fmtBase(v) {
  const c = trip.meta.baseCur || '';
  const s = Math.round(v).toLocaleString();
  return c === 'USD' ? '$' + s : s + ' ' + c;
}
function fmtHome(v) {
  const c = trip.meta.homeCur || '';
  const s = Math.round(v).toLocaleString('ko-KR');
  return c === 'KRW' ? '₩ ' + s : s + ' ' + c;
}
function addDays(dateStr, n) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return null;
  d.setDate(d.getDate() + n);
  return d;
}
const fmtDate = d => d ? (d.getMonth() + 1) + '/' + d.getDate() : '';
function totals() {
  const nights = trip.cities.reduce((a, c) => a + num(c.nights), 0);
  const ground = trip.cities.reduce((a, c) => a + num(c.nights) * num(c.daily), 0);
  const transport = trip.routes.reduce((a, r) => a + num(r.cost), 0);
  const fixed = trip.costs.reduce((a, c) => a + num(c.amount), 0);
  const grand = ground + transport + fixed;
  const countries = [...new Set(trip.cities.map(c => (c.country || '').trim()).filter(Boolean))];
  const spent = trip.ledger.reduce((a, l) => a + num(l.amount), 0);
  const spentHome = trip.ledger.reduce((a, l) => a + num(l.amount) * (num(l.fx) || num(trip.meta.fx)), 0);
  return { nights, ground, transport, fixed, grand, countries, spent, spentHome };
}
function cityWarnings(c) {
  const m = trip.meta, w = [], n = num(c.nights);
  if (num(m.minNights) && n < num(m.minNights)) w.push('최소 ' + m.minNights + '박보다 짧음');
  if (!c.trek && num(m.maxNightsNoTrek) && n > num(m.maxNightsNoTrek)) w.push('트레킹 없는 도시인데 ' + m.maxNightsNoTrek + '박 초과');
  return w;
}
function routeWarning(r) {
  const m = trip.meta, h = num(r.hours);
  if ((r.mode === '버스' || r.mode === '셔틀') && num(m.maxDayBus) && h > num(m.maxDayBus)) return '낮 이동 ' + m.maxDayBus + '시간 초과 → 야간버스/항공 검토';
  if (r.mode === '야간버스' && num(m.maxNightBus) && h > num(m.maxNightBus)) return '야간 ' + m.maxNightBus + '시간 초과 → 항공 검토';
  return '';
}

/* ============ DOM 헬퍼 ============ */
let fidCounter = 0;
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return e;
}
function commit(rerender) {
  if (!editMode) save();
  renderHeader();
  renderStats();
  if (rerender) {
    setTimeout(() => {
      const a = document.activeElement, fid = a && a.dataset ? a.dataset.fid : null;
      renderPane();
      if (fid) { const n = document.querySelector('[data-fid="' + fid + '"]'); if (n) n.focus(); }
    }, 0);
  }
}
function viewText(v, opts) {

  if (type === 'textarea' && opts.list) {
    const lines = String(v).split('\n').map(x => x.trim()).filter(Boolean);
    return lines.length ? h('ul', {}, lines.map(x => h('li', {}, x))) : h('span', { class: 'empty' }, '—');
  }
  if (type === 'date') { const d = addDays(v, 0); return h('span', {}, d ? d.toLocaleDateString('ko-KR') : v); }
  if (type === 'number') return h('span', {}, Number(v).toLocaleString());
  return h(type === 'textarea' ? 'div' : 'span', { class: 'vtext ' + (opts.cls || '') }, String(v));
}
function field(obj, key, opts = {}) {
  const type = opts.type || 'text';
  if (!editMode && type !== 'checkbox') return viewText(obj[key], opts);
  const tag = type === 'textarea' ? 'textarea' : 'input';
  const e = h(tag, { placeholder: opts.ph || '', class: opts.cls || '', style: opts.style || '', rows: opts.rows || null });
  if (tag === 'input') e.type = type;
  e.dataset.fid = 'f' + (fidCounter++);
  if (type === 'checkbox') {
    e.checked = !!obj[key];
    if (!editMode && !opts.live) e.disabled = true;
    e.addEventListener('change', () => { obj[key] = e.checked; commit(true); });
  } else {
    e.value = obj[key] ?? '';
    e.addEventListener('input', () => {
      obj[key] = type === 'number' ? (e.value === '' ? '' : parseFloat(e.value)) : e.value;
      commit(false);
    });

  }
  return e;
}
function selectField(obj, key, options) {

  const e = h('select', {}, options.map(o => h('option', { value: o }, o)));
  e.dataset.fid = 'f' + (fidCounter++);
  e.value = obj[key] ?? options[0];
  e.addEventListener('change', () => { obj[key] = e.value; commit(true); });
  return e;
}
function rowCtrl(arr, i) {
  if (!editMode) return null;
  return h('span', { style: 'white-space:nowrap' },
    h('button', { class: 'btn ghost sm', title: '위로', onclick: () => { if (i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; commit(true); } } }, '↑'),
    h('button', { class: 'btn ghost sm', title: '아래로', onclick: () => { if (i < arr.length - 1) { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; commit(true); } } }, '↓'),
    h('button', { class: 'btn ghost sm', title: '삭제', onclick: () => { arr.splice(i, 1); commit(true); } }, '✕')

}
function editTable(arr, cols, makeNew, opts = {}) {
  const thead = h('thead', {}, h('tr', {}, cols.map(c => h('th', { class: c.num ? 'num' : '' }, c.label)), editMode ? h('th', {}, '') : null));
  const tbody = h('tbody', {}, arr.map((row, i) => h('tr', {}, cols.map(c => {
    let content;
    if (c.render) content = c.render(row, i);
    else if (c.options) content = selectField(row, c.key, c.options);
    else content = field(row, c.key, { type: c.type, ph: c.ph, live: c.live });
    return h('td', { class: c.num ? 'num' : '', style: editMode && c.w ? 'min-width:' + c.w : '' }, content);
  }), editMode ? h('td', {}, rowCtrl(arr, i)) : null)));

  if (editMode) wrap.append(h('button', { class: 'btn soft sm no-print', style: 'margin-top:8px', onclick: () => { arr.push(makeNew()); commit(true); } }, '+ 행 추가'));
  else if (!arr.length) wrap.append(h('p', { class: 'hint', style: 'margin-top:8px' }, '아직 없음 · 편집 모드에서 추가하세요'));

    const r = await fetch('https://open.er-api.com/v6/latest/' + encodeURIComponent(m.baseCur));
    const d = await r.json();
    const rate = d && d.rates && d.rates[m.homeCur];
    if (!rate) throw new Error();
    m.fx = rate >= 100 ? Math.round(rate) : Math.round(rate * 10000) / 10000;
    m.fxUpdated = new Date().toLocaleDateString('ko-KR') + ' 기준';
    commit(true);
  } catch (e) {
    btn.textContent = '실패 (직접 입력하세요)';
  }
}

/* ============ 여행 관리 ============ */
function switchTrip(id) {
  if (!store.trips[id]) return;
  store.current = id; trip = store.trips[id];
  save(); renderAll();
}
function newTrip() {
  const t = blankTrip();
  store.trips[t.id] = t;
  activeTab = 'settings';
  switchTrip(t.id);
  enterEdit();
}
function dupTrip() {
  const t = JSON.parse(JSON.stringify(trip));
  t.id = uid(); t.meta.title = (t.meta.title || '여행') + ' (복사)'; t.ledger = [];
  store.trips[t.id] = t;
  switchTrip(t.id);
}
function delTrip() {
  if (Object.keys(store.trips).length <= 1) { alert('마지막 여행은 삭제할 수 없습니다. 새 여행을 먼저 만드세요.'); return; }
  if (!confirm('"' + trip.meta.title + '"을(를) 삭제할까요? 되돌릴 수 없습니다.')) return;
  delete store.trips[trip.id];
  switchTrip(Object.keys(store.trips)[0]);
}
function stamp() {
  const d = new Date(), z = x => String(x).padStart(2, '0');
  return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '_' + z(d.getHours()) + z(d.getMinutes());
}
const safeName = x => String(x || 'trip').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 60);
function download(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportTrip() {
  download({ type: 'trip', version: 1, exportedAt: new Date().toISOString(), device: deviceName(), trip },
    safeName(trip.meta.title) + '_' + stamp() + '_' + safeName(deviceName()) + '.json');
}
function exportAll() {
  download({ type: 'backup', version: 1, exportedAt: new Date().toISOString(), device: deviceName(), trips: Object.values(store.trips) },
    'TripPlanner_전체백업_' + stamp() + '_' + safeName(deviceName()) + '.json');
}
function normalizeTrip(t) {
  if (!t || !t.meta || !Array.isArray(t.cities)) return null;
  const base = blankTrip();
  const out = Object.assign(base, t, { meta: Object.assign(base.meta, t.meta) });
  if (!out.id) out.id = uid();
  return out;
}
function addImported(t, log) {
  const ex = store.trips[t.id];
  if (ex) {
    const keep = confirm('"' + (ex.meta.title || '') + '" 여행이 이미 이 기기에 있습니다.\n\n확인: 가져온 파일로 덮어쓰기\n취소: 사본으로 따로 추가');
    if (!keep) { t.id = uid(); t.meta.title = (t.meta.title || '여행') + ' (가져옴)'; log.push('사본 추가: ' + t.meta.title); }
    else log.push('덮어씀: ' + t.meta.title);
  } else log.push('추가: ' + t.meta.title);
  store.trips[t.id] = t;
  return t.id;
}
async function importFiles(input) {
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;
  const log = [], bad = [];
  let lastId = null;
  for (const f of files) {
    try {
      const d = JSON.parse(await f.text());
      let list = [];
      if (d && d.type === 'backup' && Array.isArray(d.trips)) list = d.trips;
      else if (d && d.type === 'trip' && d.trip) list = [d.trip];
      else list = [d];                       // 예전 형식 (여행 객체만 있는 파일)
      const valid = list.map(normalizeTrip).filter(Boolean);
      if (!valid.length) throw new Error();
      valid.forEach(t => lastId = addImported(t, log));
    } catch (e) { bad.push(f.name); }
  }
  if (lastId) switchTrip(lastId);
  alert((log.length ? log.join('\n') : '가져온 여행 없음') + (bad.length ? '\n\n읽지 못한 파일: ' + bad.join(', ') : ''));
}
